services:
  dashboard:
    build: .
    image: personal-dashboard:latest
    container_name: personal-dashboard
    # Startet den Container automatisch neu (auch nach Server-Reboot),
    # solange er nicht manuell gestoppt wurde -> 24/7-Betrieb.
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
